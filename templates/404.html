{% extends "layout.html" %}

{% block title %}404 · Page Not Found · Chishiki{% endblock %}

  <div class="inline-block px-3 py-1 bg-[#eae5dd] dark:bg-[#252525] text-[#555] dark:text-[#aaa] text-[11px] tracking-widest uppercase font-mono rounded">
    404 Error
